version: 1

# 首次交互登录可能需要打开浏览器；超时后不会删除节点状态。
startup_timeout: 5m
drain_timeout: 15s

# 可选的内置只读 Web UI。只能监听 loopback；省略整个段落即关闭。
web_ui:
  listen: "127.0.0.1:18180"

profiles:
  - id: home
    hostname: tailbridge-macos
    # 省略时默认为：
    # ~/Library/Application Support/TailBridge/profiles/home/tsnet
    ephemeral: false
    control_url: ""
    # 0 表示自动选择 UDP 端口；仅在防火墙/NAT 有明确要求时固定。
    udp_port: 0
    # 可选：请求控制面授予标签，是否生效仍由 Tailnet ACL/Grants 决定。
    # advertise_tags: ["tag:tailbridge"]
    # 可选：定期检查指定 DERP 区域，但不强制把业务流量固定到该区域。
    # derp_check_region: "sin"
    # 启用后，start 会把一次性的 SOCKS5 凭据 JSON 写到 stdout。
    socks5: false

routes:
  - id: grafana
    local_port: 18080
    upstream: "http://grafana:3000"

  - id: database
    local_port: 15432
    upstream: "database:5432"
